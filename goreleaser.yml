version: 2
builds:
  - id: watchtower
    main: ./main.go
    binary: watchtower
    goos:
      - linux
      - windows
    goarch:
      - amd64
      - 386
      - arm
      - arm64
    ldflags:
      - -s -w -X github.com/todd2982/watchtower/internal/meta.Version={{.Version}}
archives:
  -
    name_template: >-
      {{ .ProjectName }}_
      {{- if eq .Os "darwin" }}macOS
      {{- else if eq .Os "linux" }}linux
      {{- else if eq .Os "windows" }}windows
      {{- else }}{{ .Os }}{{ end }}_
      {{- if eq .Arch "amd64" }}amd64
      {{- else if eq .Arch "386" }}386
      {{- else if eq .Arch "arm" }}armhf
      {{- else if eq .Arch "arm64" }}arm64v8
      {{- else }}{{ .Arch }}{{ end }}
    format: tar.gz
    format_overrides:
      - goos: windows
        format: zip
    files:
      - LICENSE.md
dockers:
  -
    ids:
      - watchtower
    build_flag_templates: [ "--platform=linux/amd64", "--provenance=false" ]
    goos: linux
    goarch: amd64
    goarm: ''
    dockerfile: dockerfiles/Dockerfile
    image_templates:
      - todd2982/watchtower:amd64-{{ .Version }}
      - todd2982/watchtower:amd64-latest
  -
    ids:
      - watchtower
    build_flag_templates: [ "--platform=linux/386", "--provenance=false" ]
    goos: linux
    goarch: 386
    goarm: ''
    dockerfile: dockerfiles/Dockerfile
    image_templates:
      - todd2982/watchtower:i386-{{ .Version }}
      - todd2982/watchtower:i386-latest
  -
    ids:
      - watchtower
    build_flag_templates: [ "--platform=linux/arm/v6", "--provenance=false" ]
    goos: linux
    goarch: arm
    goarm: 6
    dockerfile: dockerfiles/Dockerfile
    image_templates:
      - todd2982/watchtower:armhf-{{ .Version }}
      - todd2982/watchtower:armhf-latest
  -
    ids:
      - watchtower
    build_flag_templates: [ "--platform=linux/arm64/v8", "--provenance=false" ]
    goos: linux
    goarch: arm64
    goarm: ''
    dockerfile: dockerfiles/Dockerfile
    image_templates:
      - todd2982/watchtower:arm64v8-{{ .Version }}
      - todd2982/watchtower:arm64v8-latest
docker_manifests:
  - name_template: todd2982/watchtower:{{ .Version }}
    image_templates:
      - todd2982/watchtower:amd64-{{ .Version }}
      - todd2982/watchtower:i386-{{ .Version }}
      - todd2982/watchtower:armhf-{{ .Version }}
      - todd2982/watchtower:arm64v8-{{ .Version }}
  - name_template: todd2982/watchtower:latest
    image_templates:
      - todd2982/watchtower:amd64-latest
      - todd2982/watchtower:i386-latest
      - todd2982/watchtower:armhf-latest
      - todd2982/watchtower:arm64v8-latest
changelog:
  use: git
  sort: asc
  groups:
    - title: Features
      regexp: '^feat(\(.+\))?!?:'
      order: 0
    - title: Bug Fixes
      regexp: '^fix(\(.+\))?!?:'
      order: 1
    - title: Security Updates
      regexp: '^security(\(.+\))?!?:'
      order: 2
    - title: Documentation
      regexp: '^docs(\(.+\))?!?:'
      order: 3
    - title: Other Changes
      regexp: '.*'
      order: 999
  filters:
    exclude:
      - '^Merge pull request'
      - '^Merge branch'
      - '^chore\(deps\):'
      - '^test:'

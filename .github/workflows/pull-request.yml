name: Pull Request

on:
  workflow_dispatch: {}
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Test
    strategy:
      fail-fast: false
      matrix:
        go-version:
          - 1.24.x
        platform:
          - macos-latest
          - windows-latest
          - ubuntu-latest
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.24.x
      - name: Run tests
        run: |
          go test -v -coverprofile coverage.out -covermode atomic ./...
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.24.x
      - name: Build
        uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: release --snapshot --skip=publish --clean

  commitlint:
    name: Validate Commit Messages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Validate commit messages
        uses: wagoid/commitlint-github-action@v6
        with:
          configFile: .commitlintrc.yml
          failOnWarnings: false

  changelog-preview:
    name: Changelog Preview
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Generate changelog preview
        id: changelog
        run: |
          # Get the merge base between PR branch and main
          MERGE_BASE=$(git merge-base HEAD origin/main)

          # Get commits between merge base and HEAD
          COMMITS=$(git log --pretty=format:"%s" $MERGE_BASE..HEAD)

          # Initialize changelog sections
          FEAT=""
          FIX=""
          SECURITY=""
          DOCS=""
          OTHER=""

          # Process each commit
          while IFS= read -r commit; do
            # Skip excluded patterns
            if echo "$commit" | grep -qE '^Merge pull request|^Merge branch|^chore\(deps\):|^test:'; then
              continue
            fi

            # Categorize commits
            if echo "$commit" | grep -qE '^feat(\(.+\))?!?:'; then
              FEAT="${FEAT}- ${commit#feat*: }"$'\n'
            elif echo "$commit" | grep -qE '^fix(\(.+\))?!?:'; then
              FIX="${FIX}- ${commit#fix*: }"$'\n'
            elif echo "$commit" | grep -qE '^security(\(.+\))?!?:'; then
              SECURITY="${SECURITY}- ${commit#security*: }"$'\n'
            elif echo "$commit" | grep -qE '^docs(\(.+\))?!?:'; then
              DOCS="${DOCS}- ${commit#docs*: }"$'\n'
            else
              OTHER="${OTHER}- ${commit}"$'\n'
            fi
          done <<< "$COMMITS"

          # Build changelog
          CHANGELOG=""

          if [ -n "$FEAT" ]; then
            CHANGELOG="${CHANGELOG}### Features"$'\n\n'"${FEAT}"$'\n'
          fi

          if [ -n "$FIX" ]; then
            CHANGELOG="${CHANGELOG}### Bug Fixes"$'\n\n'"${FIX}"$'\n'
          fi

          if [ -n "$SECURITY" ]; then
            CHANGELOG="${CHANGELOG}### Security Updates"$'\n\n'"${SECURITY}"$'\n'
          fi

          if [ -n "$DOCS" ]; then
            CHANGELOG="${CHANGELOG}### Documentation"$'\n\n'"${DOCS}"$'\n'
          fi

          if [ -n "$OTHER" ]; then
            CHANGELOG="${CHANGELOG}### Other Changes"$'\n\n'"${OTHER}"$'\n'
          fi

          # Set output
          if [ -z "$CHANGELOG" ]; then
            echo "CHANGELOG=No changelog entries found (commits may be filtered out or follow excluded patterns)" >> "$GITHUB_OUTPUT"
          else
            {
              echo 'CHANGELOG<<EOF'
              echo "$CHANGELOG"
              echo EOF
            } >> "$GITHUB_OUTPUT"
          fi
      - name: Comment PR with changelog preview
        uses: actions/github-script@v8
        with:
          script: |
            const changelog = process.env.CHANGELOG;
            const body = `## 📋 Changelog Preview

            This is what the changelog will look like when this PR is merged and a release is created:

            ${changelog}

            ---
            *This preview is generated from commits in this PR compared to the main branch.*`;

            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('📋 Changelog Preview')
            );

            // Update or create comment
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }
        env:
          CHANGELOG: ${{ steps.changelog.outputs.CHANGELOG }}
